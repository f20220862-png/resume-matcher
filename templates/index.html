<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ResumeMatch — JD to LaTeX Resume Tailor</title>
<meta name="description" content="Paste your LaTeX resume and a job description to instantly get a tailored, ATS-optimised LaTeX resume."/>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:ital,wght@0,400;0,500;1,400&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0d0d;
    --surface: #141414;
    --surface2: #1a1a1a;
    --border: #2a2a2a;
    --accent: #c8f135;
    --accent2: #f1c135;
    --accent-dim: rgba(200,241,53,0.1);
    --accent-border: rgba(200,241,53,0.2);
    --text: #f0f0f0;
    --muted: #666;
    --code-bg: #111;
    --tag-bg: #1e1e1e;
  }

  body {
    font-family: 'DM Mono', monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── Header ── */
  .header {
    padding: 22px 36px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .header-title {
    font-family: 'Syne', sans-serif;
    font-weight: 800;
    font-size: 22px;
    letter-spacing: -0.5px;
    color: var(--accent);
  }
  .header-sub {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  .header-pill {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--tag-bg);
    border: 1px solid var(--border);
    color: var(--muted);
    font-size: 10px;
    padding: 4px 12px;
    border-radius: 20px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .header-pill .dot-live {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* ── Workspace: top 2 panels ── */
  .workspace {
    display: grid;
    grid-template-columns: 1fr 1fr;
    height: calc(50vh - 33px);
    border-bottom: 1px solid var(--border);
  }

  .panel {
    display: flex;
    flex-direction: column;
    border-right: 1px solid var(--border);
    overflow: hidden;
  }
  .panel:last-child { border-right: none; }

  .panel-header {
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface);
    flex-shrink: 0;
  }
  .panel-num {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 11px;
    color: var(--accent);
    background: var(--accent-dim);
    border: 1px solid var(--accent-border);
    width: 22px; height: 22px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .panel-title {
    font-family: 'Syne', sans-serif;
    font-weight: 600;
    font-size: 13px;
    color: var(--text);
  }
  .panel-hint {
    margin-left: auto;
    font-size: 10px;
    color: var(--muted);
  }

  textarea {
    flex: 1;
    background: var(--bg);
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 11.5px;
    line-height: 1.7;
    padding: 16px 20px;
    resize: none;
    overflow-y: auto;
  }
  textarea::placeholder { color: #2e2e2e; }

  /* ── Status bar ── */
  .status-bar {
    padding: 6px 20px;
    border-top: 1px solid var(--border);
    font-size: 10px;
    color: var(--muted);
    display: flex;
    gap: 16px;
    background: var(--surface);
    flex-shrink: 0;
  }
  .status-ok { color: var(--accent); }
  .char-count { margin-left: auto; }

  /* ── Output section ── */
  .output-section {
    display: flex;
    flex-direction: column;
    height: calc(50vh - 33px);
  }

  .output-header {
    padding: 12px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--surface);
    flex-shrink: 0;
  }

  .output-body {
    flex: 1;
    overflow-y: auto;
    position: relative;
  }

  /* Placeholder */
  .placeholder-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 12px;
    color: var(--muted);
    text-align: center;
    padding: 40px;
  }
  .placeholder-icon { font-size: 36px; opacity: 0.15; }
  .placeholder-text { font-size: 12px; line-height: 1.6; max-width: 260px; }
  .placeholder-text strong { color: var(--accent); opacity: 0.7; }

  /* Loading */
  .loading-state {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100%;
    gap: 16px;
  }
  .loading-dots { display: flex; gap: 6px; }
  .dot {
    width: 6px; height: 6px;
    background: var(--accent);
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-8px); opacity: 1; }
  }
  .loading-label {
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.06em;
  }

  /* LaTeX code output */
  .latex-output {
    margin: 0;
    padding: 20px 24px 100px;
    background: var(--code-bg);
    color: #e0e0e0;
    font-family: 'DM Mono', monospace;
    font-size: 11.5px;
    line-height: 1.75;
    white-space: pre;
    overflow-x: auto;
    min-height: 100%;
  }
  /* Simple LaTeX syntax colouring */
  .latex-output .cmd  { color: #c8f135; }   /* \commands  */
  .latex-output .env  { color: #f1c135; }   /* {environments} */
  .latex-output .cmt  { color: #555; font-style: italic; }  /* % comments */
  .latex-output .brace{ color: #888; }      /* {} */

  /* Error */
  .error-msg {
    background: rgba(255,80,80,0.08);
    border: 1px solid rgba(255,80,80,0.2);
    color: #ff6b6b;
    font-size: 11px;
    padding: 16px 20px;
    margin: 20px;
    border-radius: 4px;
    line-height: 1.6;
  }

  /* ── Action bar ── */
  .action-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: linear-gradient(to top, var(--bg) 55%, transparent);
    padding: 16px 36px 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    z-index: 100;
  }

  .btn-main {
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.04em;
    background: var(--accent);
    color: #0d0d0d;
    border: none;
    padding: 13px 40px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.15s ease;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .btn-main:hover { background: #d9ff45; transform: translateY(-1px); }
  .btn-main:active { transform: translateY(0); }
  .btn-main:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

  .btn-secondary {
    font-family: 'Syne', sans-serif;
    font-size: 12px;
    font-weight: 600;
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 13px 20px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.15s ease;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .btn-secondary:hover { color: var(--text); border-color: #444; }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 2px; }
</style>
</head>
<body>

<div class="header">
  <span class="header-title">ResumeMatch</span>
  <span class="header-sub">JD → LaTeX Resume</span>
  <div class="header-pill">
    <span class="dot-live"></span>
    Gemini AI
  </div>
</div>

<div class="workspace">
  <!-- Panel 1: JD -->
  <div class="panel">
    <div class="panel-header">
      <div class="panel-num">1</div>
      <span class="panel-title">Job Description</span>
      <span class="panel-hint">paste the JD</span>
    </div>
    <textarea id="jd" placeholder="Paste the full job description here...

The more detail — responsibilities, requirements, nice-to-haves — the better the tailoring."></textarea>
    <div class="status-bar">
      <span id="jd-status">waiting for input</span>
      <span class="char-count" id="jd-count">0 chars</span>
    </div>
  </div>

  <!-- Panel 2: LaTeX Resume -->
  <div class="panel">
    <div class="panel-header">
      <div class="panel-num">2</div>
      <span class="panel-title">Your LaTeX Resume</span>
      <span class="panel-hint">paste .tex source</span>
    </div>
    <textarea id="resume" placeholder="Paste your full LaTeX resume source here...

Example:
\documentclass[a4paper,11pt]{article}
\usepackage{...}
\begin{document}
  ...
\end{document}"></textarea>
    <div class="status-bar">
      <span id="resume-status">waiting for input</span>
      <span class="char-count" id="resume-count">0 chars</span>
    </div>
  </div>
</div>

<!-- Output Section -->
<div class="output-section">
  <div class="output-header">
    <div class="panel-num" style="background:rgba(241,193,53,0.1);border-color:rgba(241,193,53,0.25);color:var(--accent2);">3</div>
    <span class="panel-title">Tailored LaTeX Output</span>
    <span id="output-meta" style="margin-left:auto;font-size:10px;color:var(--muted);"></span>
  </div>
  <div class="output-body" id="output-body">
    <div class="placeholder-state" id="placeholder">
      <div class="placeholder-icon">⌥</div>
      <div class="placeholder-text">Paste your JD and <strong>.tex</strong> source above,<br>then hit <strong>Generate LaTeX</strong></div>
    </div>
  </div>
</div>

<!-- Action Bar -->
<div class="action-bar">
  <button class="btn-secondary" id="copy-btn" style="display:none" onclick="copyLatex()" id="copy-btn">
    ⎘ Copy LaTeX
  </button>
  <button class="btn-main" id="tailor-btn" onclick="tailorResume()">
    <span id="btn-label">✦ Generate LaTeX</span>
  </button>
</div>

<script>
const jdEl       = document.getElementById('jd');
const resumeEl   = document.getElementById('resume');
const outputBody = document.getElementById('output-body');
const tailorBtn  = document.getElementById('tailor-btn');
const btnLabel   = document.getElementById('btn-label');
const copyBtn    = document.getElementById('copy-btn');
const outputMeta = document.getElementById('output-meta');

let lastLatex = '';

// ── Char counters ──
jdEl.addEventListener('input', () => {
  const n = jdEl.value.length;
  document.getElementById('jd-count').textContent = n + ' chars';
  const s = document.getElementById('jd-status');
  s.textContent = n > 50 ? '✓ ready' : 'paste JD above';
  s.className   = n > 50 ? 'status-ok' : '';
});

resumeEl.addEventListener('input', () => {
  const n = resumeEl.value.length;
  document.getElementById('resume-count').textContent = n + ' chars';
  const s = document.getElementById('resume-status');
  s.textContent = n > 50 ? '✓ ready' : 'paste .tex above';
  s.className   = n > 50 ? 'status-ok' : '';
});

// ── Main action ──
async function tailorResume() {
  const jd     = jdEl.value.trim();
  const resume = resumeEl.value.trim();

  if (!jd || jd.length < 30) {
    showError('Please paste the job description first (Panel 1).');
    return;
  }
  if (!resume || resume.length < 30) {
    showError('Please paste your LaTeX resume source first (Panel 2).');
    return;
  }

  tailorBtn.disabled = true;
  copyBtn.style.display = 'none';
  outputMeta.textContent = '';
  btnLabel.textContent   = 'Generating...';

  outputBody.innerHTML = `
    <div class="loading-state">
      <div class="loading-dots">
        <div class="dot"></div><div class="dot"></div><div class="dot"></div>
      </div>
      <div class="loading-label">Analysing JD · Matching keywords · Rewriting LaTeX</div>
    </div>`;

  try {
    const response = await fetch('/api/tailor', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ jd, resume })
    });

    const data = await response.json();
    if (data.error) throw new Error(data.error);
    let text = data.content || '';
    if (!text) throw new Error('Empty response from AI');

    // Strip any accidental markdown code fences the model may add
    text = text.replace(/^```(?:latex|tex)?\s*/i, '').replace(/```\s*$/, '').trim();

    lastLatex = text;

    // Render with syntax highlighting
    outputBody.innerHTML = `<pre class="latex-output">${syntaxHighlight(text)}</pre>`;

    const lines = text.split('\n').length;
    outputMeta.textContent = `${lines} lines`;
    outputMeta.style.color = 'var(--accent)';
    copyBtn.style.display  = 'flex';
    btnLabel.textContent   = '✦ Re-generate';

  } catch (err) {
    showError('Something went wrong. Check your inputs and try again.\n' + err.message);
    btnLabel.textContent = '✦ Generate LaTeX';
  } finally {
    tailorBtn.disabled = false;
  }
}

// ── Copy LaTeX ──
function copyLatex() {
  if (!lastLatex) return;
  navigator.clipboard.writeText(lastLatex).then(() => {
    copyBtn.innerHTML = '✓ Copied!';
    setTimeout(() => { copyBtn.innerHTML = '⎘ Copy LaTeX'; }, 2000);
  });
}

// ── Error display ──
function showError(msg) {
  outputBody.innerHTML = `<div class="error-msg">${escapeHtml(msg)}</div>`;
  tailorBtn.disabled   = false;
  btnLabel.textContent = '✦ Generate LaTeX';
}

// ── Simple LaTeX syntax highlighter ──
function syntaxHighlight(code) {
  // Escape HTML first
  let s = escapeHtml(code);
  // Comments
  s = s.replace(/(%.+)/g, '<span class="cmt">$1</span>');
  // \commands
  s = s.replace(/(\\[a-zA-Z*]+)/g, '<span class="cmd">$1</span>');
  // {braces}
  s = s.replace(/([{}])/g, '<span class="brace">$1</span>');
  return s;
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
</html>
